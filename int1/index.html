<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="pandem">
            <div class="logo">
                <img src="img/logo.png" alt="">
            </div> 
            <div class="pandem-title">
                <p>Pandem</p>
            </div>           
        </div>
        <div class="menu">
            <ul>
                <li>Docs</li>
                <li>Pricing</li>
                <li>Status</li>
                <li>FAQs</li>
                <li>Contact Us</li>
            </ul>
        </div>
        <div class="account">
            <div class="login">
                <p>Login</p>
            </div>
            <div class="signup">
                <p>Sign Up</p>
            </div>
        </div>
        <div class="menu-mobile">
            <img src="img/menumob.png" alt="Menu mobile">
        </div>
    </header>
    <main>
        <div class="intro-pandem">
            <h1>Information you need during on-call emergencies</h1>     
            <p>Quickly link new on-call tickets to similar past incidents and their solutions. All directly in Slack the moment an incident happens.</p>       
        </div>
        <button class="button-start">
            <p>Get Started ></p>
        </button>
        <div class="img-maing">
            <img src="img/hero_image.png" alt="Cuenta de una imagen">
        </div>

    </main>
</body>
</html>
